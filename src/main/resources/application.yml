server:
  servlet:
    context-path: /integracao-poupa-compra
#   tomcat:
#     accesslog:
# # here we say that we want to enable accesslog
#       enabled : false
# # it is important to understand what the options means:
# # 'directory/prefix + suffix + file-date-format' will be
# # the file that tomcat will try to open.
# # /dev/stdout is standard output, so we want tomcat
# # to write to that fd. Then, we need to play with
# # directory, prefix, suffix and file-date-format to match our desired path.
#       directory: /dev
#       prefix: stdout
#       buffered: false
#       suffix:
#       file-date-format:
spring:
  application:
    name: "integracao-poupa-compra"
  main:
    banner-mode: "off"      
  flyway:
    enabled: false
  web:
    resources:
      add-mappings: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:postmessage}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      client-secret: ${APPLE_CLIENT_SECRET:}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    ROOT: INFO
    "[br.com.poupacompra.integracao]": INFO
    "[org.springframework]": WARN
    "[org.hibernate]": WARN
    "[org.flywaydb]": INFO
