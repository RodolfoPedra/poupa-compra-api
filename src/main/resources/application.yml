server:
  servlet:
    context-path: /integracao-poupa-compra
#   tomcat:
#     accesslog:
# # here we say that we want to enable accesslog
#       enabled : false
# # it is important to understand what the options means:
# # 'directory/prefix + suffix + file-date-format' will be
# # the file that tomcat will try to open.
# # /dev/stdout is standard output, so we want tomcat
# # to write to that fd. Then, we need to play with
# # directory, prefix, suffix and file-date-format to match our desired path.
#       directory: /dev
#       prefix: stdout
#       buffered: false
#       suffix:
#       file-date-format:
spring:
  application:
    name: "integracao-poupa-compra"
  main:
    banner-mode: "off"      
  flyway:
    enabled: false
  web:
    resources:
      add-mappings: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      client-secret: ${APPLE_CLIENT_SECRET:}
logging:
  group:
    tomcat: "org.apache.catalina,org.apache.coyote,org.apache.tomcat,org.apache.http"
  level:
    ROOT: INFO
    tomcat: INFO
    sql: INFO
    web: INFO
    "[poupacompra.integracao]": DEBUG
    "[ch.qos.logback]": ERROR
    "[com.amazonaws]": WARN
    "[com.netflix.discovery]": ERROR
    # "[com.zaxxer.hikari]": INFO
    "[com.tngtech.archunit]": ERROR
    "[com.sun]": INFO
    "[io.github.resilience4j]": INFO
    "[io.micrometer]": INFO
    "[io.awspring]": INFO
    "[javax.management.mbeanserver]": INFO
    "[javax.management.remote.rmi]": INFO
    "[javax.xml]": INFO
    "[jdk.event.security]": INFO
    "[org.flywaydb]": INFO
    "[org.jboss]": INFO
    "[org.hibernate]": ERROR
    "[org.mariadb]": INFO
    "[org.postgresql]": INFO
    "[org.springframework.aop]": INFO
    "[org.springframework.beans]": INFO
    "[org.springframework.boot]": INFO
    "[org.springframework.cloud]": INFO
    "[org.springframework.cloud.configuration]": INFO
    "[org.springframework.cloud.context]": INFO
    "[org.springframework.cloud.openfeign]": INFO
    "[org.springframework.cloud.sleuth]": INFO
    "[org.springframework.context]": INFO
    "[org.springframework.core]": INFO
    "[org.springframework.data]": INFO
    "[org.springframework.jdbc]": ERROR
    "[org.springframework.jmx]": ERROR
    "[org.springframework.orm]": INFO
    "[org.springframework.oxm]": INFO
    "[org.springframework.amqp.rabbit]": INFO
    "[org.springframework.scheduling]": INFO
    "[org.springframework.security]": ERROR
    "[org.springframework.test]": INFO
    "[org.springframework.ui]": ERROR
    "[org.springframework.web]": INFO
    "[org.springframework.ws]": INFO
    "[org.springframework.ws.client.MessageTracing.sent]": TRACE
    "[org.springframework.ws.client.MessageTracing.received]": TRACE
    "[_org.springframework.web.servlet]": INFO
    "[reactor.util]": INFO
    "[reactor.core]": INFO
    "[sun.rmi]": ERROR
    "[sun.net]": DEBUG
    "[unknown.jul.logger]": ERROR
