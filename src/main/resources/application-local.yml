spring:
  datasource:
      url: jdbc:postgresql://postgres:5432/poupacompra
      username: postgres
      password: postgresql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
       hibernate:
         dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
