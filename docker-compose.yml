services:
  poupacompra:
    build:
      context: .
      dockerfile: local.Dockerfile
    image: poupacompra_local
    container_name: poupacompra-integracao
    networks:
      - local
    ports:
      - 8182:8182
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8182/integracao-poupa-compra/actuator/health || exit 1
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  local:
    external: true
