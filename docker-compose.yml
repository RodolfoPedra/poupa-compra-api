services:
  poupacompra:
    build:
      context: .
      dockerfile: local.Dockerfile
    image: poupacompra_local
    container_name: poupacompra-integracao
    networks:
      - local
    ports:
      - 8182:8080
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Defina GOOGLE_CLIENT_ID no ambiente}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Defina GOOGLE_CLIENT_SECRET no ambiente}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-postmessage}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/integracao-poupa-compra/actuator/health || exit 1
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  local:
    external: true
